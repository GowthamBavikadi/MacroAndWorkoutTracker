name: Android CI & APK Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Assemble release and debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Copy standalone Gym.apk
        run: cp app/build/outputs/apk/release/app-release.apk Gym.apk

      - name: Upload Gym.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gym-APK
          path: Gym.apk
